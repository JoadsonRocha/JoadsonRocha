<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" aria-label="Joadson Rocha - Full Stack Developer e Gestor em TI">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090912"/>
      <stop offset="50%" stop-color="#0F0C1D"/>
      <stop offset="100%" stop-color="#090912"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1433"/>
      <stop offset="50%" stop-color="#231942"/>
      <stop offset="100%" stop-color="#1A1433"/>
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="898" height="308" rx="20" fill="url(#bgGrad)" stroke="#2A2444" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="308" rx="20" fill="url(#glowLeft)"/>
  <rect x="1" y="1" width="898" height="308" rx="20" fill="url(#glowRight)"/>
  <rect x="120" y="1" width="660" height="2" rx="1" fill="url(#topLine)"/>

  <!-- Top Eyebrow Pill -->
  <rect x="330" y="24" width="240" height="24" rx="12" fill="#131122" stroke="#2E2650" stroke-width="1"/>
  <circle cx="348" cy="36" r="3.5" fill="#10B981"/>
  <text x="456" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#CBD5E1">BOA VISTA - RR • BRASIL</text>

  <!-- Name -->
  <text x="450" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.8" fill="url(#nameGrad)">Joadson Rocha</text>

  <!-- Role Badge -->
  <rect x="110" y="114" width="680" height="34" rx="17" fill="url(#pillBg)" stroke="#6D28D9" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="450" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#DDD6FE">FULL STACK DEVELOPER | GESTOR DE TI • GERENTE DE PROJETOS &amp; EDTECH | PROFESSOR</text>

  <!-- Bio -->
  <text x="450" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.8" fill="#94A3B8">Profissional de Tecnologia e Educação com graduação em Gestão em TI e MBA em Gestão Ágil de Projetos.</text>
  <text x="450" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.8" fill="#94A3B8">Sólida formação em Scrum, Design Thinking, gestão da qualidade (ISO 9000) e cibersegurança.</text>
  <text x="450" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.8" fill="#CBD5E1">Construindo plataformas SaaS, apps desktop de alta performance e soluções EdTech de impacto real.</text>

  <!-- Tech Strip Pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">
    <rect x="127" y="252" width="66" height="28" rx="8" fill="#151226" stroke="#2D264D" stroke-width="1"/>
    <text x="160" y="270">React</text>

    <rect x="203" y="252" width="94" height="28" rx="8" fill="#151226" stroke="#2D264D" stroke-width="1"/>
    <text x="250" y="270">TypeScript</text>

    <rect x="307" y="252" width="82" height="28" rx="8" fill="#151226" stroke="#2D264D" stroke-width="1"/>
    <text x="348" y="270">Electron</text>

    <rect x="399" y="252" width="76" height="28" rx="8" fill="#151226" stroke="#2D264D" stroke-width="1"/>
    <text x="437" y="270">Node.js</text>

    <rect x="485" y="252" width="88" height="28" rx="8" fill="#151226" stroke="#2D264D" stroke-width="1"/>
    <text x="529" y="270">Supabase</text>

    <rect x="583" y="252" width="72" height="28" rx="8" fill="#151226" stroke="#2D264D" stroke-width="1"/>
    <text x="619" y="270">Python</text>

    <rect x="665" y="252" width="108" height="28" rx="8" fill="#151226" stroke="#2D264D" stroke-width="1"/>
    <text x="719" y="270">Tailwind CSS</text>
  </g>
</svg>
