<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="320" height="230" role="img" aria-label="Mestrio - Plataforma SaaS">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141224"/>
      <stop offset="100%" stop-color="#0D0B18"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="318" height="228" rx="16" fill="url(#cardBg)" stroke="#2A2444" stroke-width="1.5"/>
  <rect x="30" y="1" width="260" height="2" rx="1" fill="url(#topGlow)"/>

  <!-- Header -->
  <text x="22" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Mestrio</text>

  <!-- Online Badge -->
  <rect x="226" y="19" width="72" height="24" rx="12" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="240" cy="31" r="3.5" fill="#10B981"/>
  <text x="250" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#34D399">Online</text>

  <!-- Description -->
  <text x="22" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.2" fill="#94A3B8">Aplicação em nuvem para automação e</text>
  <text x="22" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.2" fill="#94A3B8">centralização operacional, gerenciamento</text>
  <text x="22" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.2" fill="#94A3B8">modular de fluxos e visualização</text>
  <text x="22" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.2" fill="#94A3B8">inteligente de métricas.</text>

  <!-- Stack Chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#A78BFA" text-anchor="middle">
    <rect x="22" y="136" width="50" height="22" rx="6" fill="#1E1B38" stroke="#3B2F6B" stroke-width="1"/>
    <text x="47" y="151">React</text>

    <rect x="78" y="136" width="58" height="22" rx="6" fill="#1E1B38" stroke="#3B2F6B" stroke-width="1"/>
    <text x="107" y="151">Node.js</text>

    <rect x="142" y="136" width="60" height="22" rx="6" fill="#1E1B38" stroke="#3B2F6B" stroke-width="1"/>
    <text x="172" y="151">Railway</text>

    <rect x="208" y="136" width="48" height="22" rx="6" fill="#1E1B38" stroke="#3B2F6B" stroke-width="1"/>
    <text x="232" y="151">Cloud</text>
  </g>

  <!-- CTA Button -->
  <rect x="22" y="174" width="276" height="36" rx="10" fill="url(#btnGrad)"/>
  <text x="160" y="197" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">↗ Visitar App</text>
</svg>
